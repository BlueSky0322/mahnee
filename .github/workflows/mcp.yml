name: Deploy MCP
on:
  workflow_run:
    workflows: [Build and Deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mahnee-mcp
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Prepare OAuth storage and human consent
        id: access
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tools/cloudflare/mcp-access.mjs
      - name: Deploy native OAuth Worker before changing edge protection
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MCP_HOST: ${{ steps.access.outputs.MCP_HOST }}
          ACCESS_CONSENT_AUD: ${{ steps.access.outputs.ACCESS_CONSENT_AUD }}
          MCP_KV_ID: ${{ steps.access.outputs.MCP_KV_ID }}
        run: |
          config=$(mktemp "$PWD/.wrangler.mcp.XXXXXX.json")
          trap 'rm -f "$config"' EXIT
          node --input-type=module - "$config" <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('wrangler.mcp.jsonc', 'utf8'));
          config.vars.MCP_ORIGIN = 'https://' + process.env.MCP_HOST;
          config.vars.ACCESS_CONSENT_AUD = process.env.ACCESS_CONSENT_AUD;
          config.kv_namespaces = [{binding: 'OAUTH_KV', id: process.env.MCP_KV_ID}];
          writeFileSync(process.argv[2], JSON.stringify(config));
          JS
          yarn wrangler deploy --config "$config"
      - name: Retire verified legacy Access applications
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tools/cloudflare/mcp-access.mjs --activate
      - name: Check public native OAuth discovery
        env:
          MCP_HOST: ${{ steps.access.outputs.MCP_HOST }}
        run: node tools/cloudflare/check-mcp.mjs
