<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Mahnee</title>
    <!-- The status bar, the device's light or dark ground until the script below decides -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f3f1ec"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0f1012"
    />
    <!--
      The browser tab's icon: the logo on its tile, which follows the device's light or dark
      (icon.svg); browsers that can't show it take the cobalt PNGs
      (tools/icons/make-icons.js makes them)
    -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/icon.svg"
    />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <!-- Sent with the Access cookie, or the sign-in page would answer instead -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
      crossorigin="use-credentials"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
      crossorigin
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      crossorigin
    />
    <!--
      The first screen, shown before the app's code has loaded: the background of the
      theme this device last used (or the phone's own, on Auto) and the logo on a tile of
      the saved accent, the coin coming to rest in the hand. main.tsx fades it out once the
      app is up. The saved theme's key and the colours are the app's own (sf-appearance in
      profile/ProfileContext.tsx, --ground and --accent in theme/tokens.css);
      launch-screen.test.ts and paper-ledger-launch.test.ts keep them in step.
    -->
    <script>
      (function () {
        var theme = 'auto';
        var accent = null;
        try {
          var saved = JSON.parse(localStorage.getItem('sf-appearance') || '{}');
          if (saved.theme === 'light' || saved.theme === 'dark') theme = saved.theme;
          if (/^(cobalt|green|plum|rust|graphite)$/.test(saved.accent)) accent = saved.accent;
        } catch (e) {}
        if (theme === 'auto') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-launch', theme);
        if (accent) document.documentElement.setAttribute('data-accent', accent);
        var bars = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < bars.length; i++) {
          bars[i].setAttribute('content', theme === 'light' ? '#f3f1ec' : '#0f1012');
        }
      })();
    </script>
    <style>
      html {
        background: #f3f1ec;
      }
      html[data-launch='dark'] {
        background: #0f1012;
      }
      #launch {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #f3f1ec;
        transition: opacity 0.2s ease-out;
      }
      html[data-launch='dark'] #launch {
        background: #0f1012;
      }
      #launch[data-done] {
        opacity: 0;
        pointer-events: none;
      }
      #launch svg {
        width: 88px;
        height: 88px;
        overflow: visible;
      }
      /* The tile in the accent (cobalt until another is saved), the hand and coin in the
         ink written on it */
      #launch .tile {
        fill: #2d4bd8;
      }
      html[data-launch='dark'] #launch .tile {
        fill: #93a5ff;
      }
      html[data-accent='green'] #launch .tile {
        fill: #1b7a52;
      }
      html[data-accent='green'][data-launch='dark'] #launch .tile {
        fill: #6cc59a;
      }
      html[data-accent='plum'] #launch .tile {
        fill: #8a3c8f;
      }
      html[data-accent='plum'][data-launch='dark'] #launch .tile {
        fill: #d494d8;
      }
      html[data-accent='rust'] #launch .tile {
        fill: #b04a1c;
      }
      html[data-accent='rust'][data-launch='dark'] #launch .tile {
        fill: #f0956a;
      }
      html[data-accent='graphite'] #launch .tile {
        fill: #3f4248;
      }
      html[data-accent='graphite'][data-launch='dark'] #launch .tile {
        fill: #c4c6cd;
      }
      #launch .hand,
      #launch .coin {
        fill: #ffffff;
      }
      html[data-launch='dark'] #launch .hand,
      html[data-launch='dark'] #launch .coin {
        fill: #0f1012;
      }
      /* The tile and hand come up, then the coin drops into the hand */
      #launch svg {
        animation: launch-in 0.3s ease-out both;
      }
      #launch .coin {
        animation: launch-coin 0.4s ease-out 0.25s both;
      }
      @keyframes launch-in {
        from {
          opacity: 0;
          transform: scale(0.92);
        }
      }
      @keyframes launch-coin {
        from {
          opacity: 0;
          transform: translateY(-28px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #launch svg,
        #launch .coin {
          animation: none;
        }
      }
    </style>
  </head>
  <body>

      id="launch"
      aria-hidden="true"
    >

        />
      </svg>
    </div>
    <div id="root"></div>
    <script

      src="/src/main.tsx"
    ></script>
  </body>
</html>
